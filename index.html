<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рибний Дім Анна</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="header-container">

      <!-- LOGO -->

      <a href="#" class="logo">
        <img src="media/logo-icon.png" alt="logo">
      </a>

      <!-- MENU -->

      <nav class="nav">
        <a href="#">Головна</a>
        <a href="#">Продукція</a>
        <a href="#">Доставка</a>
        <a href="#">Контакти</a>
        <a href="#">Про нас</a>
      </nav>

      <!-- INSTAGRAM -->

      <a href="#" class="header-instagram">
        Instagram
      </a>

    </div>

  </header>

  <!-- HERO -->

  <section class="hero">

    <!-- VIDEO -->

    <video autoplay muted loop playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>

    <!-- OVERLAY -->

    <div class="overlay"></div>

    <!-- CONTENT -->

    <div class="hero-content">

      <!-- BIG LOGO -->

      <img class="hero-logo" src="logo.png" alt="logo">

      <!-- TWO LISTS -->

      <div class="hero-lists">

        <ul class="fish-list">
          <li>Риба</li>
          <li>Морепродукти</li>
          <li>Напівфабрикати</li>
          <li>Ікра</li>
        </ul>

        <ul class="fish-list">
          <li>Лосось</li>
          <li>Форель</li>
          <li>Сири</li>
          <li>Соуси</li>
        </ul>

      </div>

    </div>

  </section>

</body>
</html>
